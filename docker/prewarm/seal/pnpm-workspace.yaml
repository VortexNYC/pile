  "@playwright/browser-chromium": true
  "@swc/core": true
  core-js: true
  core-js-pure: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  workerd: true

onlyBuiltDependencies:
  - "@playwright/browser-chromium"
  - "@swc/core"
  - core-js
  - core-js-pure
  - esbuild
  - onnxruntime-node
  - protobufjs
