nodeLinker: isolated
strictPeerDependencies: false
autoInstallPeers: true

packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

catalog:
  "@types/node": "^25.9.7"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "react": "^19.3.0"
