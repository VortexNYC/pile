name: Artifacts Sync

on:
  push:
    branches-ignore:
      # Merge-queue temp refs are throwaway — pushing them to Artifacts
      # would burn cloudflare-ci runs on group refs GitHub deletes.
      - "gh-readonly-queue/**"
      # Agent-lane branches churn constantly and never get preview deploys —
      # syncing them spends a pipeline run (container + build minutes) per
      # push on branches that exist only to hold a lane's PR diff. Lanes open
      # PRs off these branches; GitHub-side PR checks still run normally.
      - "issue-*"
  workflow_dispatch:

concurrency:
  group: artifacts-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Push to Cloudflare Artifacts
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    env:
      ARTIFACTS_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_PUSH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Push to Artifacts
        run: |
          set -euo pipefail
          REMOTE="https://${ARTIFACTS_ACCOUNT_ID}.artifacts.cloudflare.net/git/vortex/pile.git"
          # Artifacts is a mirror: force-push so rebased/rewritten branches still sync.
          git -c http.extraHeader="Authorization: Bearer ${ARTIFACTS_TOKEN}" push --force "$REMOTE" "HEAD:refs/heads/${GITHUB_REF_NAME}"
