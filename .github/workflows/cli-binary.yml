name: CLI Binary

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suffix: linux-x64 }
          - { os: macos-latest, suffix: darwin-arm64 }
          - { os: macos-13, suffix: darwin-x64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Build binary
        run: pnpm -C packages/cli run build:bin

      - name: Rename artifact
        run: mv packages/cli/dist/pile "pile-${{ matrix.suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pile-${{ matrix.suffix }}
          path: pile-${{ matrix.suffix }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@da05d552573ad5c039eaef89633c8b1cdcd53bf2 # v2.4.1
        with:
          files: dist/**/pile-*
          generate_release_notes: true
