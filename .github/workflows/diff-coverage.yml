name: Diff Coverage

# Separate from ci.yml so editing the PR description (to add a
# "No tests: <reason>" line) re-runs only this cheap gate.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diff-coverage:
    name: diff-coverage
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit plus its first parent (the base tip).
          fetch-depth: 2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Diff coverage
        env:
          DIFF_COVERAGE_BASE: HEAD^1
          PR_BODY: ${{ github.event.pull_request.body }}
        run: vp run diff-coverage
