name: Diff Coverage

# Separate from ci.yml so editing the PR description (to add a
# "No tests: <reason>" line) re-runs only this cheap gate.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diff-coverage:
    name: diff-coverage
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit plus its first parent (the base tip).
          fetch-depth: 2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Resolve PR body
        # merge_group carries no PR body — pull it via the API using the
        # queue branch name (…pr-<N>-<sha>).
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(echo "${{ github.event.merge_group.head_ref }}" | grep -oE 'pr-[0-9]+' | cut -d- -f2)
          BODY=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUM}" --jq .body)
          echo "PR_BODY<<__EOF__" >> "$GITHUB_ENV"
          echo "$BODY" >> "$GITHUB_ENV"
          echo "__EOF__" >> "$GITHUB_ENV"

      - name: Diff coverage
        env:
          DIFF_COVERAGE_BASE: HEAD^1
          PR_BODY: ${{ github.event.pull_request.body || env.PR_BODY }}
        run: vp run diff-coverage
