<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pile Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <section data-panel="sign-in" hidden>
        <label>
          Email
          <input id="email" type="email" autocomplete="username" />
        </label>
        <label>
          Password
          <input
            id="password"
            type="password"
            autocomplete="current-password"
          />
        </label>
        <button id="sign-in" type="button">Sign in to Pile</button>
      </section>

      <section data-panel="workspaces" hidden>
        <p class="hint">Choose a workspace</p>
        <div id="workspace-list" class="workspace-list"></div>
      </section>

      <section data-panel="signed-in" hidden>
        <button id="capture" type="button">Pile it</button>
        <div class="options">
          <label class="check">
            <input id="include-screenshot" type="checkbox" checked />
            Attach screenshot
          </label>
          <label class="check">
            <input id="include-summary" type="checkbox" checked />
            Summarize page
          </label>
          <label class="check">
            <input id="include-full-text" type="checkbox" />
            Include full page text
          </label>
        </div>
        <details class="routing">
          <summary>Route to…</summary>
          <label>
            Team
            <select id="team">
              <option value="">Default team</option>
            </select>
          </label>
          <label>
            Project
            <select id="project">
              <option value="">No project</option>
            </select>
          </label>
          <label>
            Labels
            <select id="labels" multiple size="4"></select>
          </label>
        </details>
        <p id="workspace" class="workspace"></p>
        <button id="sign-out" type="button" class="text">Sign out</button>
      </section>

      <div id="status" class="status" aria-live="polite"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
