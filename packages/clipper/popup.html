<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pile Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <button id="capture" type="button">Pile it</button>
      <div id="status" class="status" aria-live="polite"></div>
      <details id="settings">
        <summary>Settings</summary>
        <label>
          Pile base URL
          <input id="baseUrl" type="text" placeholder="https://pile.nyc" />
        </label>
        <label>
          API key
          <input id="apiKey" type="password" placeholder="Bearer token" />
        </label>
        <label>
          Workspace
          <input id="orgId" type="text" placeholder="org_vortex_main" />
        </label>
        <button id="save" type="button">Save</button>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
