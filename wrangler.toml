# Default (self-host) configuration: `wrangler deploy` auto-provisions
# D1 and R2 when IDs are omitted. The hosted Pile instance lives in
# [env.production] and is deployed with `wrangler deploy -e production`.
name = "pile-dev"
main = "src/index.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

# The capture SDK's browser bundle lives in src/assets/capture.iife.ts (a
# generated string module) and is served at /capture.js — regenerated by
# `pnpm run capture:bundle`.

[vars]
# Replace these with your Worker's real URL after the first deploy.
# Placeholder must remain a syntactically valid URL (Better Auth validates it).
BETTER_AUTH_URL = "https://pile.example.workers.dev"
ALLOWED_ORIGINS = "https://pile.example.workers.dev"
SLACK_REDIRECT_URI = "https://pile.example.workers.dev/slack/oauth"
# Optional: agent dispatch defaults
# DEVIN_MODEL = "swe-2"
# Compute backend for headless CLI providers. "cloudflare" uses the Sandbox
# container below (no external account needed); "daytona" requires
# DAYTONA_API_KEY as a secret.
COMPUTE_PROVIDER = "cloudflare"
# Must be a verified sender on your account's Email Routing domain.
EMAIL_FROM = "notifications@example.com"

[[d1_databases]]
binding = "D1"
database_name = "pile-global"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"

[[r2_buckets]]
binding = "ATTACHMENTS_BUCKET"
bucket_name = "pile-attachments"

[[durable_objects.bindings]]
name = "WORKSPACE_DURABLE_OBJECT"
class_name = "WorkspaceDO"

[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"

[[durable_objects.bindings]]
name = "SANDBOX_CURSOR"
class_name = "CursorSandbox"

[[durable_objects.bindings]]
name = "SANDBOX_DEVIN"
class_name = "DevinSandbox"

[[durable_objects.bindings]]
name = "SANDBOX_CODEX"
class_name = "CodexSandbox"

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile.sandbox"
max_instances = 20
instance_type = "standard-1"

[[containers]]
class_name = "CursorSandbox"
image = "./Dockerfile.sandbox-cursor"
max_instances = 20
instance_type = "standard-1"

[[containers]]
class_name = "DevinSandbox"
image = "./Dockerfile.sandbox-devin"
max_instances = 20
instance_type = "standard-1"

[[containers]]
class_name = "CodexSandbox"
image = "./Dockerfile.sandbox-codex"
max_instances = 20
instance_type = "standard-1"

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "webhook-queue"

[[queues.consumers]]
queue = "webhook-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[triggers]
crons = ["*/5 * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CursorSandbox", "DevinSandbox", "CodexSandbox"]

[env.production]
name = "pile"

routes = [{ pattern = "pile.nyc", custom_domain = true }]

[env.production.vars]
BETTER_AUTH_URL = "https://pile.nyc"
ALLOWED_ORIGINS = "https://pile.nyc"
SLACK_REDIRECT_URI = "https://pile.nyc/slack/oauth"
DAYTONA_SNAPSHOT = "vortex-cli-runner-v2"
DAYTONA_VOLUME_ID = "0f79e741-e373-496b-a83f-7252cd5b9f12"
DEVIN_MODEL = "swe-2"
EMAIL_FROM = "notifications@pile.nyc"
COMPUTE_PROVIDER = "cloudflare"
PUBLIC_API_URL = "https://pile.nyc"
FEEDBACK_CHANNEL_ID = "cc2f808d-007e-48a1-870f-bd4c68ae0cd6"
# Shared container admission ledger (PILE-302) — lanes reserve a slot before
# spawning; CF_ADMISSION_TOKEN is a wrangler secret matching cloudflare-ci's
# ADMIN_TOKEN.
CF_ADMISSION_URL = "https://cloudflare-ci.shlomo-31b.workers.dev"

[[env.production.d1_databases]]
binding = "D1"
database_name = "pile-global"
database_id = "c4f71628-3f93-4be1-ac11-48b5611f5934"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "ATTACHMENTS_BUCKET"
bucket_name = "pile-attachments"


[[env.production.durable_objects.bindings]]
name = "WORKSPACE_DURABLE_OBJECT"
class_name = "WorkspaceDO"

[[env.production.durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_CURSOR"
class_name = "CursorSandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_DEVIN"
class_name = "DevinSandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_CODEX"
class_name = "CodexSandbox"

# Production pins registry digests so `wrangler deploy` never needs a Docker
# daemon (cloudflare-ci's sandbox has none). The Dockerfiles remain the source
# of truth for image contents; releasing a new image is a docker-host step:
#   wrangler containers build -p -t <name>:<tag> -f Dockerfile.sandbox-* .
# then update the digest here. `wrangler containers info <app-id>` shows the
# digest a pushed tag landed on.
[[env.production.containers]]
class_name = "Sandbox"
image = "registry.cloudflare.com/31bfc2c14a28e0a39e8b9e3c556a18be/pile-sandbox-production@sha256:177e408e62062b025a6e9a75a659eb88bd271a4dcd0e4a8e8d40bdaaa5fae5b4"
max_instances = 20
instance_type = "standard-1"

[[env.production.containers]]
class_name = "CursorSandbox"
image = "registry.cloudflare.com/31bfc2c14a28e0a39e8b9e3c556a18be/pile-cursorsandbox-production@sha256:28a55370d583c03721d6dc9b52e7b908c27e148cf860ca5ba63000e99cc4a87c"
max_instances = 20
instance_type = "standard-1"

[[env.production.containers]]
class_name = "DevinSandbox"
image = "registry.cloudflare.com/31bfc2c14a28e0a39e8b9e3c556a18be/pile-devinsandbox-production@sha256:c9b3773bf482587377c71c8c84511aa7530de19745b7c7ca0ab83ff3a0e4cf73"
max_instances = 20
instance_type = "standard-1"

[[env.production.containers]]
class_name = "CodexSandbox"
image = "registry.cloudflare.com/31bfc2c14a28e0a39e8b9e3c556a18be/pile-codexsandbox-production@sha256:a88dcb498f92a2cdb53b7f9480a83cbd4be92966a05c0fb133bc63204596e4c6"
max_instances = 20
instance_type = "standard-1"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

[[env.production.migrations]]
tag = "v3"
new_sqlite_classes = ["CursorSandbox", "DevinSandbox", "CodexSandbox"]

[[env.production.queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "webhook-queue"

[[env.production.queues.consumers]]
queue = "webhook-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[[env.production.send_email]]
name = "EMAIL"
