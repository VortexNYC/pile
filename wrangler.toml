# Default (self-host) configuration: `wrangler deploy` auto-provisions
# D1 and R2 when IDs are omitted. The hosted Pile instance lives in
# [env.production] and is deployed with `wrangler deploy -e production`.
name = "pile-dev"
main = "src/index.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

# The capture SDK's browser bundle lives in src/assets/capture.iife.ts (a
# generated string module) and is served at /capture.js — regenerated by
# `pnpm run capture:bundle`.

# Member console (apps/web) — a Vite SPA served same-origin under /app so
# Better Auth cookies just work. The Worker runs first and maps /app/* onto
# the asset tree (see src/api/app.ts); build with `pnpm -C apps/web build`.
[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
run_worker_first = true

[vars]
FIRECRAWL_BASE_URL = "https://firecrawl.vortex.nyc"
SCRAPLING_BASE_URL = "https://scrapling.vortex.nyc"
BROWSERLESS_BASE_URL = "https://browserless.vortex.nyc"
WAPPALYZER_BASE_URL = "https://fingerprint.vortex.nyc"
LIGHTPANDA_BASE_URL = "https://lightpanda.vortex.nyc"
OBSCURA_BASE_URL = "https://obscura.vortex.nyc"
# Replace these with your Worker's real URL after the first deploy.
# Placeholder must remain a syntactically valid URL (Better Auth validates it).
BETTER_AUTH_URL = "https://pile.example.workers.dev"
ALLOWED_ORIGINS = "https://pile.example.workers.dev"
SLACK_REDIRECT_URI = "https://pile.example.workers.dev/slack/oauth"
# Optional: agent dispatch defaults
# DEVIN_MODEL = "swe-2"
# Compute backend for headless CLI providers. "cloudflare" uses the Sandbox
# container below (no external account needed); "daytona" requires
# DAYTONA_API_KEY as a secret.
COMPUTE_PROVIDER = "cloudflare"
# Must be a verified sender on your account's Email Routing domain.
EMAIL_FROM = "notifications@example.com"

[[d1_databases]]
binding = "D1"
database_name = "pile-global"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"

[[r2_buckets]]
binding = "ATTACHMENTS_BUCKET"
bucket_name = "pile-attachments"

# Shared lane cache (PILE-306): mounted into each Cloudflare sandbox under a
# per-workspace, per-repo prefix. Optional — omit it and lanes fall back to
# the HTTP pnpm-store cache in ATTACHMENTS_BUCKET.
[[r2_buckets]]
binding = "LANE_CACHE_BUCKET"
bucket_name = "pile-lane-cache"

[[durable_objects.bindings]]
name = "WORKSPACE_DURABLE_OBJECT"
class_name = "WorkspaceDO"

[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"

[[durable_objects.bindings]]
name = "SANDBOX_CURSOR"
class_name = "CursorSandbox"

[[durable_objects.bindings]]
name = "SANDBOX_DEVIN"
class_name = "DevinSandbox"

[[durable_objects.bindings]]
name = "SANDBOX_CODEX"
class_name = "CodexSandbox"

# sandbox-sdk 1.0 lanes — new classes + bindings alongside 0.12 (a
# scheduling_policy move is one-way; the old classes stay for rollback).
[[durable_objects.bindings]]
name = "SANDBOX_LANE"
class_name = "LaneSandbox"

[[durable_objects.bindings]]
name = "SANDBOX_LANE_CURSOR"
class_name = "LaneCursorSandbox"

[[durable_objects.bindings]]
name = "SANDBOX_LANE_DEVIN"
class_name = "LaneDevinSandbox"

[[durable_objects.bindings]]
name = "SANDBOX_LANE_CODEX"
class_name = "LaneCodexSandbox"

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile.sandbox"
max_instances = 20
instance_type = "standard-1"

[[containers]]
class_name = "CursorSandbox"
image = "./Dockerfile.sandbox-cursor"
max_instances = 20
instance_type = "standard-1"

[[containers]]
class_name = "DevinSandbox"
image = "./Dockerfile.sandbox-devin"
max_instances = 20
instance_type = "standard-1"

[[containers]]
class_name = "CodexSandbox"
image = "./Dockerfile.sandbox-codex"
max_instances = 20
instance_type = "standard-1"

[[containers]]
class_name = "LaneSandbox"
name = "pile-lane-v1"
scheduling_policy = "durable_object"
images = { lane = { dockerfile = "./Dockerfile.sandbox" } }

[[containers]]
class_name = "LaneCursorSandbox"
name = "pile-lane-cursor-v1"
scheduling_policy = "durable_object"
images = { cursor = { dockerfile = "./Dockerfile.sandbox-cursor" } }

[[containers]]
class_name = "LaneDevinSandbox"
name = "pile-lane-devin-v1"
scheduling_policy = "durable_object"
images = { devin = { dockerfile = "./Dockerfile.sandbox-devin" } }

[[containers]]
class_name = "LaneCodexSandbox"
name = "pile-lane-codex-v1"
scheduling_policy = "durable_object"
images = { codex = { dockerfile = "./Dockerfile.sandbox-codex" } }

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "webhook-queue"

[[queues.consumers]]
queue = "webhook-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[triggers]
crons = ["*/5 * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CursorSandbox", "DevinSandbox", "CodexSandbox"]

[[migrations]]
tag = "v4"
new_sqlite_classes = [
  "LaneSandbox",
  "LaneCursorSandbox",
  "LaneDevinSandbox",
  "LaneCodexSandbox",
]

[env.production]
name = "pile"
minify = true

routes = [
  { pattern = "pile.nyc", custom_domain = true },
  { pattern = "app.pile.nyc", custom_domain = true },
]
# Required for `wrangler versions upload --preview-alias` branch previews
# (<alias>-pile.vortex-nyc.workers.dev) — cloudflare-ci runs that on
# non-main artifact pushes.
workers_dev = true

[env.production.vars]
BETTER_AUTH_URL = "https://pile.nyc"
ALLOWED_ORIGINS = "https://pile.nyc,https://app.pile.nyc"
SLACK_REDIRECT_URI = "https://pile.nyc/slack/oauth"
DAYTONA_SNAPSHOT = "vortex-cli-runner-v2"
DAYTONA_VOLUME_ID = "0f79e741-e373-496b-a83f-7252cd5b9f12"
DEVIN_MODEL = "swe-2"
EMAIL_FROM = "notifications@pile.nyc"
COMPUTE_PROVIDER = "cloudflare"
PUBLIC_API_URL = "https://pile.nyc"
FEEDBACK_CHANNEL_ID = "cc2f808d-007e-48a1-870f-bd4c68ae0cd6"
# Shared container admission ledger (PILE-302) — lanes reserve a slot before
# spawning; CF_ADMISSION_TOKEN is a wrangler secret matching cloudflare-ci's
# ADMIN_TOKEN.
CF_ADMISSION_URL = "https://cloudflare-ci.vortex-nyc.workers.dev"

# Self-binding: the flue agent provider targets pile's own /dispatch/pile
# over an in-process service binding — zone loopback fetch is blocked (1016).
[[env.production.services]]
binding = "FLUE_WORKER"
service = "pile"
entrypoint = "default"

[[env.production.d1_databases]]
binding = "D1"
database_name = "pile-global"
database_id = "222e823e-3594-457d-add1-1827064d4bc8"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "ATTACHMENTS_BUCKET"
bucket_name = "pile-attachments"

# Same as top level — env configs don't inherit bindings.
[[env.production.r2_buckets]]
binding = "LANE_CACHE_BUCKET"
bucket_name = "pile-lane-cache"


[[env.production.durable_objects.bindings]]
name = "WORKSPACE_DURABLE_OBJECT"
class_name = "WorkspaceDO"

[[env.production.durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_CURSOR"
class_name = "CursorSandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_DEVIN"
class_name = "DevinSandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_CODEX"
class_name = "CodexSandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_LANE"
class_name = "LaneSandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_LANE_CURSOR"
class_name = "LaneCursorSandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_LANE_DEVIN"
class_name = "LaneDevinSandbox"

[[env.production.durable_objects.bindings]]
name = "SANDBOX_LANE_CODEX"
class_name = "LaneCodexSandbox"

# Production pins registry digests so `wrangler deploy` never needs a Docker
# daemon (cloudflare-ci's sandbox has none). The Dockerfiles remain the source
# of truth for image contents; releasing a new image is a docker-host step:
#   wrangler containers build -p -t <name>:<tag> -f Dockerfile.sandbox-* .
# then update the digest here. `wrangler containers info <app-id>` shows the
# digest a pushed tag landed on.
[[env.production.containers]]
class_name = "Sandbox"
image = "registry.cloudflare.com/953346ce1b4f27fa04a76d83aeccab28/pile-sandbox-production@sha256:ffa97d3252c9078b622984222a45bf58b2349a611caab576b1b4896f36439571"
max_instances = 20
instance_type = "standard-1"

[[env.production.containers]]
class_name = "CursorSandbox"
image = "registry.cloudflare.com/953346ce1b4f27fa04a76d83aeccab28/pile-cursorsandbox-production@sha256:4277e9b4fa677398f9668dcd5cfa331ee9b2bde3f31d95ac964b5980c977a80a"
max_instances = 20
instance_type = "standard-1"

[[env.production.containers]]
class_name = "DevinSandbox"
image = "registry.cloudflare.com/953346ce1b4f27fa04a76d83aeccab28/pile-devinsandbox-production@sha256:3472c7f6e39abc4c51bb7cf774bf225e95455db2a505b8c3ca8f0c80cdad3645"
max_instances = 20
instance_type = "standard-1"

[[env.production.containers]]
class_name = "CodexSandbox"
image = "registry.cloudflare.com/953346ce1b4f27fa04a76d83aeccab28/pile-codexsandbox-production@sha256:c549ea8426d13613bb307fc69694d4a18d89a8c402a5506f8e9d1e684621f52d"
max_instances = 20
instance_type = "standard-1"

[[env.production.containers]]
class_name = "LaneSandbox"
name = "pile-lane-v1"
scheduling_policy = "durable_object"
images = { lane = { dockerfile = "./Dockerfile.sandbox" } }

[[env.production.containers]]
class_name = "LaneCursorSandbox"
name = "pile-lane-cursor-v1"
scheduling_policy = "durable_object"
images = { cursor = { dockerfile = "./Dockerfile.sandbox-cursor" } }

[[env.production.containers]]
class_name = "LaneDevinSandbox"
name = "pile-lane-devin-v1"
scheduling_policy = "durable_object"
images = { devin = { dockerfile = "./Dockerfile.sandbox-devin" } }

[[env.production.containers]]
class_name = "LaneCodexSandbox"
name = "pile-lane-codex-v1"
scheduling_policy = "durable_object"
images = { codex = { dockerfile = "./Dockerfile.sandbox-codex" } }

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

[[env.production.migrations]]
tag = "v3"
new_sqlite_classes = ["CursorSandbox", "DevinSandbox", "CodexSandbox"]

[[env.production.migrations]]
tag = "v4"
new_sqlite_classes = [
  "LaneSandbox",
  "LaneCursorSandbox",
  "LaneDevinSandbox",
  "LaneCodexSandbox",
]

[[env.production.queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "webhook-queue"

[[env.production.queues.consumers]]
queue = "webhook-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[[env.production.send_email]]
name = "EMAIL"

# Branch preview target — cloudflare-ci deploys non-main artifact pushes here
# (`wrangler deploy -e staging`). Shares production data bindings (D1, R2,
# DOs, containers) so previews see real data, but has no queue consumer and
# no cron: a preview can never steal prod webhook batches or double-fire
# scheduled work. EMAIL is also omitted so previews never send real mail.
[env.staging]
name = "pile-staging"

routes = [{ pattern = "staging.pile.nyc", custom_domain = true }]

[env.staging.vars]
BETTER_AUTH_URL = "https://staging.pile.nyc"
ALLOWED_ORIGINS = "https://staging.pile.nyc"
SLACK_REDIRECT_URI = "https://staging.pile.nyc/slack/oauth"
DAYTONA_SNAPSHOT = "vortex-cli-runner-v2"
DAYTONA_VOLUME_ID = "0f79e741-e373-496b-a83f-7252cd5b9f12"
DEVIN_MODEL = "swe-2"
EMAIL_FROM = "notifications@pile.nyc"
COMPUTE_PROVIDER = "cloudflare"
PUBLIC_API_URL = "https://staging.pile.nyc"
FEEDBACK_CHANNEL_ID = "cc2f808d-007e-48a1-870f-bd4c68ae0cd6"
CF_ADMISSION_URL = "https://cloudflare-ci.vortex-nyc.workers.dev"

[[env.staging.d1_databases]]
binding = "D1"
database_name = "pile-global"
database_id = "222e823e-3594-457d-add1-1827064d4bc8"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "ATTACHMENTS_BUCKET"
bucket_name = "pile-attachments"

[[env.staging.r2_buckets]]
binding = "LANE_CACHE_BUCKET"
bucket_name = "pile-lane-cache"

[[env.staging.durable_objects.bindings]]
name = "WORKSPACE_DURABLE_OBJECT"
class_name = "WorkspaceDO"
# External binding -> prod worker's DO namespace, so previews see real data
script_name = "pile"

[[env.staging.durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"


[[env.staging.durable_objects.bindings]]
name = "SANDBOX_CURSOR"
class_name = "CursorSandbox"


[[env.staging.durable_objects.bindings]]
name = "SANDBOX_DEVIN"
class_name = "DevinSandbox"


[[env.staging.durable_objects.bindings]]
name = "SANDBOX_CODEX"
class_name = "CodexSandbox"


[[env.staging.containers]]
class_name = "Sandbox"
image = "registry.cloudflare.com/953346ce1b4f27fa04a76d83aeccab28/pile-sandbox-production@sha256:ffa97d3252c9078b622984222a45bf58b2349a611caab576b1b4896f36439571"
max_instances = 20
instance_type = "standard-1"

[[env.staging.containers]]
class_name = "CursorSandbox"
image = "registry.cloudflare.com/953346ce1b4f27fa04a76d83aeccab28/pile-cursorsandbox-production@sha256:4277e9b4fa677398f9668dcd5cfa331ee9b2bde3f31d95ac964b5980c977a80a"
max_instances = 20
instance_type = "standard-1"

[[env.staging.containers]]
class_name = "DevinSandbox"
image = "registry.cloudflare.com/953346ce1b4f27fa04a76d83aeccab28/pile-devinsandbox-production@sha256:3472c7f6e39abc4c51bb7cf774bf225e95455db2a505b8c3ca8f0c80cdad3645"
max_instances = 20
instance_type = "standard-1"

[[env.staging.containers]]
class_name = "CodexSandbox"
image = "registry.cloudflare.com/953346ce1b4f27fa04a76d83aeccab28/pile-codexsandbox-production@sha256:c549ea8426d13613bb307fc69694d4a18d89a8c402a5506f8e9d1e684621f52d"
max_instances = 20
instance_type = "standard-1"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

[[env.staging.migrations]]
tag = "v3"
new_sqlite_classes = ["CursorSandbox", "DevinSandbox", "CodexSandbox"]

[[env.staging.queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "webhook-queue"

# Top-level [triggers].crons is inherited by named envs — a staging deploy
# would double-fire the 5-min sweep against shared prod data. Explicit empty
# override keeps previews inert.
[env.staging.triggers]
crons = []
